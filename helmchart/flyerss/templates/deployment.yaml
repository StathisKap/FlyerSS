apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flyerss.fullname" . }}
  labels:
    {{- include "flyerss.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "flyerss.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flyerss.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "flyerss.serviceAccountName" . }}
      {{- if .Values.externalSecrets.dockerCredentials.enabled }}
      imagePullSecrets:
        - name: {{ include "flyerss.fullname" . }}-registry-secret
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if and .Values.externalSecrets.enabled (gt (len .Values.externalSecrets.env) 0) }}
          envFrom:
            - secretRef:
                name: {{ include "flyerss.fullname" . }}-secret
          {{- end }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "{{ .Values.service.containerPort }}"
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          # /login is the only route that answers without a session cookie
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
